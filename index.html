<!doctype html>
<html lang="en" data-bs-theme="auto">
	<head>
		<!--<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">-->
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="" />
		<meta name="author" content="Pancho"/>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Stardos+Stencil:wght@400;700&display=swap" rel="stylesheet">

		<title>NestorSDVLP: Today's Weather</title>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="assets/styles/styles.css"/>

	</head>
	<body class="bg-dark bg-gradient">

    <main>

      <section class="d-flex align-items-center vw-100 vh-100">

        <div class="w-100">
          <div class="container">
            <div class="row justify-content-center">
              <div class="col-4 text-center">

                <div id="weatherSpinner" class="spinner-border text-light fade in"></div>
                
                <div id="cardWeather" class="card fade d-none box-shadow">
                  <div class="card-header">
                    <h1 class="h4"><span class="opacity-50">Today's weather in</span><br> <span class="city-name">#</span></h1>
                  </div>
                  <div class="card-body pt-0">
                    <img src="#" class="weather-icon">
                    <h2 class="display-1"><span class="weather-temp">#</span>&ordm;</h2>
                    <h6>
                      <span class="weather-temp-min"></span> <sup>min</sup>&nbsp;/&nbsp;<span class="weather-temp-max"></span> <sup>max</sup>
                    </h6>
                    <p class="weather-desc text-capitalize opacity-50">#</p>
                  </div>
                  <div class="card-footer">
                    <p class="m-0"><span class="opacity-50"><small>Last updated</span> <strong class="last-updated">#</strong></small></p>
                  </div>
                </div>

                <div id="alertError" class="alert alert-danger alert-dismissible fade mt-3">
                  <p class="alert-message m-0">#</p>
                  <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

              </div>
            </div>
          </div>
        </div>
        
      </section>
      
    </main>

	<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.min.js" integrity="sha512-nKXmKvJyiGQy343jatQlzDprflyB5c+tKCzGP3Uq67v+lmzfnZUi/ZT+fc6ITZfSC5HhaBKUIvr/nTLCV+7F+Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script type="module" src="assets/scripts/main.js"></script>

	</body>
</html>
